<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather App</title>
  <link rel="stylesheet" href="wea.css" />
</head>
<body>
  <!-- Background Video -->
  <video autoplay muted loop id="background-video">
    <source src="default-bg.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  <!-- App Container -->
  <div id="app">
    <h1>Weather App</h1>

    <!-- 🌍 City Search with Autocomplete -->
    <div class="search-wrapper">
      <input type="text" id="city-search" placeholder="Search for a city..." autocomplete="off" />
      <ul id="suggestions" class="dropdown hidden"></ul>
    </div>

    <div id="weather-info">
      <p>Search a city to see the weather</p>
    </div>
  </div>

  <script src="weath.js"></script>
</body>
</html>
